name: jhigu_patro_utils
description: Bikram Sambat (Nepali) calendar, money, phone, address, receipt and SMS utilities. Offline-first; the only dependency is the pdf package, used by receipt_pdf.dart.
version: 1.0.0
homepage: https://github.com/surhidamatya/JhiguPatro
repository: https://github.com/surhidamatya/JhiguPatro/tree/dev/dart
issue_tracker: https://github.com/surhidamatya/JhiguPatro/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Used only by package:jhigu_patro_utils/receipt_pdf.dart. The rest of the
  # package needs no runtime dependencies.
  pdf: ^3.13.1

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
