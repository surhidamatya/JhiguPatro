<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jhigu inputs example</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; max-width: 640px; }
  section { margin: 0 0 22px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  pre { background: #f3f4f6; padding: 8px; border-radius: 6px; min-height: 2em; }
</style>
</head>
<body>
<h1>jhigu-money-input and jhigu-phone-input</h1>
<form id="f">
  <section><h2>Money, Rs., required</h2>
    <jhigu-money-input id="money" name="amount" symbol="Rs." required label="Amount" placeholder="0.00"></jhigu-money-input></section>
  <section><h2>Money, Devanagari digits, preset 1234567.5, negative allowed</h2>
    <jhigu-money-input id="money2" name="amount2" symbol="रु" devanagari allow-negative value-paisa="123456750"></jhigu-money-input></section>
  <section><h2>Phone, English, required</h2>
    <jhigu-phone-input id="phone" name="phone" required label="Phone" placeholder="98X-XXXXXXX"></jhigu-phone-input></section>
  <section><h2>Phone, Nepali</h2>
    <jhigu-phone-input id="phone2" name="phone2" language="ne" value="9841234567"></jhigu-phone-input></section>
  <button type="submit">Submit</button> <button type="reset">Reset</button>
</form>
<h2>Events and form data</h2>
<pre id="log"></pre>
<script type="module">
  import { defineJhiguMoneyInput, defineJhiguPhoneInput } from '../dist/elements/fieldElements.js';
  defineJhiguMoneyInput(); defineJhiguPhoneInput();
  const log = document.getElementById('log');
  document.addEventListener('jhiguChange', e => { const { value, ...rest } = e.detail; log.textContent += `change ${e.target.id}: ${JSON.stringify(rest)}\n`; });
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    log.textContent += 'submit ' + JSON.stringify([...new FormData(e.target).entries()]) + '\n';
  });
  window.ready = true;
</script>
</body>
</html>
