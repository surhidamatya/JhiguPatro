name: ci-js
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Kathmandu, UTC, America/Los_Angeles, Pacific/Kiritimati]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            cli/package-lock.json
            react/package-lock.json
            vue/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npm run test:run
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm ci && npm run build && npm test
        working-directory: react
      - run: npm ci && npm run build && npm test
        working-directory: vue

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: cli
      - run: npm ci && npm run build
        working-directory: react
      - run: npm ci && npm run build
        working-directory: vue
      # Packs the four npm packages, installs the tarballs in a scratch project, imports and runs
      # them. WARNs (no LICENSE yet) do not fail it; a FAIL would break a consumer.
      - run: node tools/pack-check/check.mjs

  # Server rendering and hydration of the React and Vue packages in Next.js and Nuxt, in Chromium.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: react
      - run: npm ci && npm run build
        working-directory: vue
      - run: npm ci
        working-directory: react/example-next
      - run: npm ci
        working-directory: vue/example-nuxt
      - run: npm ci
        working-directory: tools/browser-check
      - run: npx playwright-core install --with-deps chromium
        working-directory: tools/browser-check
      - run: node tools/ssr-check/check.mjs

  # The examples in examples/ are what the integration guide tells people to run: they must keep working.
  integration-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: ts
      - run: npm install
        working-directory: examples/node-script
      - run: |
          npm start | tee out.txt
          grep -q 'rejected: TOO_SHORT' out.txt
          grep -q 'प्रतिपदा' out.txt
        working-directory: examples/node-script
      - run: npm install && npm run build
        working-directory: examples/web-vite

  # The Vue package declares vue >=3.3: run its tests and type check on the oldest minors too.
  vue-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vue: [3.3.13, 3.4.38]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: ts
      - run: npm ci
        working-directory: vue
      - run: npm install --no-save vue@${{ matrix.vue }}
        working-directory: vue
      - run: node -p "'vue ' + require('vue/package.json').version"
        working-directory: vue
      - run: npx tsc --noEmit -p .
        working-directory: vue
      - run: npm test
        working-directory: vue
