name: ci-js
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Kathmandu, UTC, America/Los_Angeles, Pacific/Kiritimati]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            cli/package-lock.json
            react/package-lock.json
            vue/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npm run test:run
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm ci && npm run build && npm test
        working-directory: react
      - run: npm ci && npm run build && npm test
        working-directory: vue

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: cli
      - run: npm ci && npm run build
        working-directory: react
      - run: npm ci && npm run build
        working-directory: vue
      # Packs the four npm packages, installs the tarballs in a scratch project, imports and runs
      # them. WARNs (no LICENSE yet) do not fail it; a FAIL would break a consumer.
      - run: node tools/pack-check/check.mjs
